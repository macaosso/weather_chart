name: Generate EC wind

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Runs every 1 hour

permissions:
  contents: write

jobs:
  build-charts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Cartopy requirements)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib cartopy numpy requests scipy

      - name: Run ECMWF wind forecast script
        run: python ECwind.py

      - name: Run rain wind forecast script
        run: python rain_wind_map.py

      - name: Commit and push updated maps
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *map90146842.png ECwind/*.png
          git commit -m "Auto-update synoptic weather and ECMWF wind charts: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push
