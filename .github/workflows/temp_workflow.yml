name: Generate Temperature Maps

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

permissions:
  contents: write

jobs:
  build-temp-maps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib cartopy numpy requests scipy

      - name: Run temperature map script
        run: python temp_map.py

      - name: Commit and push updated temperature maps
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add temp_maps/*.png
          git commit -m "Auto-update 2m temperature maps: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push
